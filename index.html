<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Shamvil — Creative Director & Visual Artist</title>
  <meta name="description" content="Cinematic portfolio featuring vertical reels, short films, motion graphics, and 3D visual art in a Pinterest-inspired dynamic masonry layout." />
  <meta name="author" content="Shamvil" />
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Shamvil — Creative Director & Visual Artist" />
  <meta property="og:description" content="Cinematic portfolio showcasing vertical reels, films, and motion graphics." />
  <meta property="og:type" content="website" />
  
  <!-- Circular Website Favicon & Profile Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta property="og:image" content="/profile-avatar.png" />

  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Noise Texture Backdrop -->
  <div class="noise-overlay" aria-hidden="true"></div>
  
  <!-- Ambient Glow Elements -->
  <div class="glow-orb orb-1" aria-hidden="true"></div>
  <div class="glow-orb orb-2" aria-hidden="true"></div>

  <!-- Header / Navigation -->
  <header id="site-header" class="site-header">
    <!-- Rendered by Navbar.js -->
  </header>

  <!-- Main Content App Root -->
  <main id="app">
    <!-- Rendered dynamically by Router (HomeView vs PortfolioView) -->
  </main>

  <!-- Lightbox Modal Container -->
  <div id="lightbox-root"></div>

  <!-- Global Notification Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Floating Mobile Thumb Dock Navigation -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Bottom Navigation">
    <a href="#home" class="dock-item" data-nav="home">
      <span class="dock-icon">🏠</span>
      <span class="dock-label">Home</span>
    </a>
    <a href="#portfolio" class="dock-item" data-nav="portfolio">
      <span class="dock-icon">🎬</span>
      <span class="dock-label">Portfolio</span>
    </a>
    <a href="#about" class="dock-item" data-nav="about">
      <span class="dock-icon">👤</span>
      <span class="dock-label">About</span>
    </a>
    <a href="#admin" class="dock-item" data-nav="admin">
      <span class="dock-icon">🔒</span>
      <span class="dock-label">Admin</span>
    </a>
    <a href="#contact" class="dock-item" data-nav="contact">
      <span class="dock-icon">✉️</span>
      <span class="dock-label">Contact</span>
    </a>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
